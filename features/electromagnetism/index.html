    <h1>Electromagnetism</h1>

        <h2>Coulomb's Law</h2>
            <p>
                $$ \vec{ F }_{e} = k_e \frac{ q_1q_2 }{ r^2 } \hat{r} $$
            </p>
            
        <h2>Electric Field</h2>
            <p>
                $$ \vec{ E } = \frac{ \vec{ F}_e }{ q_0 } $$
            </p>

        <h2>Charge Distribution</h2>
            <h3>Linear</h3>
                <p>
                    $$ dq = \lambda dx $$
                </p>

            <h3>Superficial</h3>
                <p>
                    $$ dq = \sigma dA $$
                </p>
            
            <h3>Volumetric</h3>
                <p>
                    $$ dq = \rho dV $$
                </p>
